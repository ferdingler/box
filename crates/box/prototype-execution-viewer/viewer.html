<div class="controls"><button id="previous" type="button" aria-label="Previous event">← Previous</button><button id="play" type="button" aria-label="Play execution">Play</button><button id="next" type="button" aria-label="Next event">Next →</button><span id="position"></span><span class="hint">Click the arrow for event details.</span></div>

<div id="timeline" class="timeline" aria-label="Execution events"><div id="timeline-inner" class="timeline-inner"></div></div>
</section>
</div>
</main>

function upperBound(array,value){let lo=0,hi=array.length;while(lo<hi){const mid=(lo+hi)>>>1;if(array[mid]<=value)lo=mid+1;else hi=mid;}return lo;}
function anyValue(value){

async function normalizeRecording(input){

function updateRuns(){

async function prepareRuns(input,filename){

function metadataRecord(e){return e&&(['trace_metadata','capture_start','capture_loss','capture_summary'].includes(e.kind));}
function order(a,b){return a.ts-b.ts||(Number(a.sequence)||0)-(Number(b.sequence)||0);}

function buildTimeline(){timelineKey='';$('timeline-inner').style.height=(eventCount()*ROW_HEIGHT)+'px';$('timeline').scrollTop=0;}

function filteredCount(){return filteredCommands===null?traces.length:filteredCommands.length;}

 const list=$('command-list'),count=filteredCount(),rank=selectedRank();$('command-list-inner').style.height=(count*COMMAND_ROW_HEIGHT)+'px';
 if(follow&&rank>=0){const top=rank*COMMAND_ROW_HEIGHT;if(top<list.scrollTop||top+COMMAND_ROW_HEIGHT>list.scrollTop+list.clientHeight)list.scrollTop=Math.max(0,top-list.clientHeight*.35);}

 if(key!==commandListKey){let html='';for(let r=first;r<last;r++){const index=traceAtRank(r),t=traces[index],text=commandLabel(t.trigger),at=(events[t.firstIndex]?.ts??start)-start;html+=`<button id="command-row-${index}" class="command-row" type="button" role="option" tabindex="-1" data-trace-index="${index}" aria-selected="false" style="top:${r*COMMAND_ROW_HEIGHT}px" title="${esc(t.trigger+' — '+outcomeTitle(t))}"><span class="command-row-title">${esc(text)}</span><span class="command-row-meta"><time title="Time from recording start">${timeLabel(at)}</time><span title="${esc(outcomeTitle(t))}">${commandOutcome(t)}</span></span></button>`;}$('command-list-inner').innerHTML=html;commandListKey=key;}

}
async function searchCommands(){
 const generation=++searchGeneration;if(loading)return;const query=$('command-search').value.trim().toLowerCase();searchPending=true;renderCommands();
 if(!query){filteredCommands=null;searchPending=false;filterRevision++;commandListKey='';$('command-list').scrollTop=0;renderCommands(true);return;}
 const numeric=query.match(/^#(\d+)$/),found=[];let budget=performance.now();
 for(let i=0;i<traces.length;i++){
  const t=traces[i];let match=true;
  if(match&&numeric)match=i===Number(numeric[1])-1;
  else if(match&&query){match=false;for(let j=0;j<t.searchFields.length;j++){if(t.searchFields[j].toLowerCase().includes(query)){match=true;break;}if((j&255)===0&&performance.now()-budget>8){await yieldNow();budget=performance.now();if(generation!==searchGeneration)return;}}}

 }

function triggerFor(e){
 if(currentTrace()?.root)return currentTrace().trigger;let current=e;const visited=new Set();

}
function renderDetails(){
 $('details').classList.toggle('hidden',!detailEvent);if(!detailEvent)return;const e=detailEvent,entries=[['Action',triggerFor(e)],['Time',timeLabel(ms(e))],['Event',e.label||e.action||e.kind],['Route',e.from&&e.to?route(e):null],['Verdict',e.verdict],['Outcome',e.outcome],['Detail',e.detail],['Origin',e.origin],['Provenance',e.provenance],['Action ID',e.action_id],['Exchange',e.exchange]];

function render(){
 if(loading||!currentEvent())return;drawDiagram();renderDetails();renderCommands();refreshNotice();$('selected-command').textContent=commandLabel(currentTrace().trigger);$('selected-command').title=currentTrace().trigger;$('frame-time').textContent=timeLabel(ms(currentEvent()));$('frame-label').textContent=eventTitle(currentEvent());$('position').textContent=(frame+1).toLocaleString()+' / '+eventCount().toLocaleString();$('previous').disabled=frame===0;$('next').disabled=frame===eventCount()-1;renderTimeline();

function pause(){playing=false;clearTimeout(timer);timer=null;$('play').textContent='Play';$('play').setAttribute('aria-label','Play execution');}

function play(){if(loading)return;if(playing){pause();return;}if(frame===eventCount()-1){frame=0;buildTimeline();}playing=true;detailEvent=null;$('play').textContent='Pause';$('play').setAttribute('aria-label','Pause execution');render();timer=setTimeout(advance,700);}
function setFrame(index){if(loading)return;pause();frame=Math.max(0,Math.min(eventCount()-1,Math.floor(index)));detailEvent=null;render();}
function setTrace(index){if(loading)return;pause();traceIndex=Math.max(0,Math.min(traces.length-1,Math.floor(index)));frame=0;detailEvent=null;buildTimeline();render();renderCommands(true);}
function seek(time){let lo=0,hi=eventCount();while(lo<hi){const mid=(lo+hi)>>>1;if(ms(eventAt(mid))<=time)lo=mid+1;else hi=mid;}setFrame(Math.max(0,lo-1));}
function step(direction){if(loading)return;pause();move(direction);render();}
function showDetails(){pause();const e=drawnEdges[0]?.event;if(e){detailEvent=detailEvent===e?null:e;renderDetails();}}
function getTraces(offset=0,limit=100,includeEvents=true){const result=[];for(let i=Math.max(0,offset);i<Math.min(traces.length,offset+Math.min(limit,1000));i++){const t=traces[i];result.push({id:t.id,trigger:t.trigger,action:t.trigger,kind:t.groupKind,eventCount:t.indices.length,...(includeEvents?{events:Array.from(t.indices,index=>events[index])}:{})});}return result;}
function getState(){
 if(loading||!currentTrace())return {loading,runId:recordingRuns[runIndex]?.id,runIndex,runCount:recordingRuns.length,actionCount:traces.length,traceCount:traces.length,totalEvents:events.length,recordStatus};
 const t=currentTrace(),first=Math.max(0,traceIndex-40),summaries=[];for(let i=first;i<Math.min(traces.length,first+100);i++)summaries.push({index:i,id:traces[i].id,trigger:traces[i].trigger,events:traces[i].indices.length});const seen=upperBound(t.leafFirst,frame),ended=upperBound(t.leafEnds,currentEvent()._index);
 return {loading:false,runId:recordingRuns[runIndex]?.id,runIndex,runCount:recordingRuns.length,actionIndex:traceIndex,actionCount:traces.length,action: t.trigger,actionKind:t.groupKind,actionRows:$('command-list-inner').childElementCount,filteredActions:filteredCount(),actions:summaries,traceIndex,traceCount:traces.length,traces:summaries,tracesWindowStart:first,frame,time:ms(currentEvent()),duration,playing,events:eventCount(),totalEvents:events.length,leaves:seen,liveLeaves:seen-ended,visibleLeaves:lastRenderLeaves.length,leafWindow,currentEvent:currentEvent(),command:t.trigger,highlightedNodes:[...visitedNodes()],edges:drawnEdges,recordStatus,loadStats,timings:loadStats,timelineRows:$('timeline-inner').childElementCount,commandOptions:0,commandRows:$('command-list-inner').childElementCount,filteredCommands:filteredCount(),commandQuery:$('command-search').value,commandOutcome:commandOutcome(t),commandSearchPending:searchPending};

async function* stringChunks(text){for(let i=0;i<text.length;i+=65536){yield text.slice(i,i+65536);await yieldNow();}}
async function* fileChunks(file){const reader=file.stream().getReader(),decoder=new TextDecoder();try{while(true){const {done,value}=await reader.read();if(done)break;yield decoder.decode(value,{stream:true});}const end=decoder.decode();if(end)yield end;}finally{reader.releaseLock();}}
async function parseNDJSON(chunks){
 const parsed=[],wire=newWireState();let buffer='',line=0,budget=performance.now();
 async function append(record){for(const event of decodeRecord(record,wire)){parsed.push(event);if(performance.now()-budget>8){await yieldNow();budget=performance.now();}}}
 for await(const chunk of chunks){buffer+=chunk;let cursor=0,end;while((end=buffer.indexOf('\n',cursor))>=0){const text=buffer.slice(cursor,end).trim();line++;if(text){let record;try{record=JSON.parse(text);}catch(error){throw Error('Invalid JSON on line '+line+'.');}await append(record);}cursor=end+1;if(performance.now()-budget>8){await yieldNow();budget=performance.now();}}buffer=buffer.slice(cursor);progress('Reading '+parsed.length.toLocaleString()+' execution records…');}

async function parseJSON(chunks){
